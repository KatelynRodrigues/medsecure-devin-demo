<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedSecure{% endblock %} — Security Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1><span class="shield">🛡</span> MedSecure</h1>
            <div class="subtitle">Security Automation Dashboard</div>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item{% if active_page == 'dashboard' %} active{% endif %}" href="/">
                <span class="icon">📊</span> Dashboard
            </a>
            <a class="nav-item{% if active_page == 'pipeline' %} active{% endif %}" href="/pipeline">
                <span class="icon">⚡</span> Pipeline View
            </a>
            <a class="nav-item{% if active_page == 'findings' %} active{% endif %}" href="/findings">
                <span class="icon">🔍</span> Findings Portal
            </a>
            <a class="nav-item{% if active_page == 'sessions' %} active{% endif %}" href="/sessions">
                <span class="icon">🤖</span> Devin Sessions
            </a>
        </nav>
        <div class="sidebar-footer">
            MedSecure v0.1.0<br>
            Powered by Devin API v3
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

<div class="modal-overlay" id="findingModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Finding Details</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<script>
async function fetchJSON(url) {
    const resp = await fetch(url);
    return resp.json();
}

function severityBadge(severity) {
    return `<span class="badge badge-${severity}">${severity}</span>`;
}

function statusBadge(status) {
    return `<span class="badge badge-${status}">${status.replace('_', ' ')}</span>`;
}

function closeModal() {
    document.getElementById('findingModal').classList.remove('active');
}

async function showFindingDetail(findingId) {
    const data = await fetchJSON(`/api/findings/${findingId}`);
    const modal = document.getElementById('findingModal');
    document.getElementById('modalTitle').textContent = `${data.rule_name} (${data.cwe_id})`;

    let sessionHTML = '';
    if (data.session) {
        sessionHTML = `
            <div class="detail-grid" style="margin-top:16px">
                <span class="detail-label">Session</span>
                <span class="detail-value">
                    <a href="${data.session.session_url}" target="_blank">${data.session.session_id.substring(0, 24)}...</a>
                </span>
                <span class="detail-label">Session Status</span>
                <span class="detail-value">${statusBadge(data.session.status)}</span>
                ${data.session.pr_url ? `
                    <span class="detail-label">Pull Request</span>
                    <span class="detail-value"><a href="${data.session.pr_url}" target="_blank">${data.session.pr_url}</a></span>
                ` : ''}
            </div>
        `;
    }

    document.getElementById('modalContent').innerHTML = `
        <div class="detail-grid">
            <span class="detail-label">Finding ID</span>
            <span class="detail-value" style="font-family:monospace;font-size:13px">${data.finding_id}</span>
            <span class="detail-label">Severity</span>
            <span class="detail-value">${severityBadge(data.severity)} &nbsp; ${data.priority_label}</span>
            <span class="detail-label">Status</span>
            <span class="detail-value">${statusBadge(data.status)}</span>
            <span class="detail-label">CWE</span>
            <span class="detail-value"><span class="cwe-tag">${data.cwe_id}</span></span>
            <span class="detail-label">Rule</span>
            <span class="detail-value">${data.rule_id}</span>
            <span class="detail-label">File</span>
            <span class="detail-value file-path">${data.file_path}:${data.start_line}</span>
            <span class="detail-label">Description</span>
            <span class="detail-value">${data.message}</span>
        </div>
        ${data.code_snippet ? `<div class="code-block">${escapeHTML(data.code_snippet)}</div>` : ''}
        ${data.recommendation ? `
            <h4 style="margin-top:20px;margin-bottom:8px;font-size:14px;color:var(--text-secondary)">Recommendation</h4>
            <p style="font-size:13px;color:var(--text-secondary);line-height:1.6">${escapeHTML(data.recommendation)}</p>
        ` : ''}
        ${sessionHTML}
        ${data.pr_url ? `
            <div style="margin-top:16px">
                <a href="${data.pr_url}" target="_blank" class="btn-primary" style="display:inline-block;text-decoration:none">View Pull Request</a>
            </div>
        ` : ''}
    `;
    modal.classList.add('active');
}

function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Close modal on overlay click
document.getElementById('findingModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// Close modal on Escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});
</script>

{% block scripts %}{% endblock %}
</body>
</html>
